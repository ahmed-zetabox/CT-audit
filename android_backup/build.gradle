// Top-level build file for React Native 0.74 + Android 14

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = "1.9.22"
    }

    repositories {
        google()
        mavenCentral()
    }


    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2") // or 8.0+
        classpath("com.google.gms:google-services:4.3.15") // latest
    }
}
